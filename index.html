<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor MAGSA</title>
<style>
:root{--bg:#f4f3ee;--sf:#fff;--tx:#141414;--mu:#6a6a62;--bd:#dedcd2;--ac:#f5c400;--act:#111;--acs:#fff4c2;--acx:#7a5c00;--wn:#b42318;--wns:#fdecea;--map:#e8e6dc;--halo:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b0b0b;--sf:#171717;--tx:#f2f2f2;--mu:#a3a3a3;--bd:#2e2e2e;--ac:#ffc400;--act:#000;--acs:#2b2400;--acx:#ffc400;--wn:#ff8a80;--wns:#3a1d1b;--map:#1a1a1a;--halo:#0b0b0b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;background:#000;border-bottom:3px solid #ffc400;flex-wrap:wrap;color:#fff}
.logo{height:66px;width:auto;display:block}
h1{font-size:16px;margin:0;color:#fff}h1 small{color:#ffc400;font-weight:600}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button,#th{border:1px solid #555;background:transparent;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:#ffc400;color:#000;border-color:#ffc400;font-weight:600}
nav button:not(.on):hover,#th:hover{border-color:#ffc400;color:#ffc400}
.ctrl button:hover,.lay button:hover,.act button:hover{background:var(--acs)}
.tab{display:none;flex:1;min-height:0}.tab.on{display:block}
.viewer{display:grid;grid-template-columns:310px 1fr 320px;height:100%;min-height:0}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--bd);background:var(--sf);min-height:0}
.ph{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--bd)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input.q{font-size:15px;padding:11px 12px;border:2px solid var(--ac)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--bd)}
.meta button{background:none;border:0;color:var(--acx);cursor:pointer;font:inherit;font-weight:600}
.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.list li{padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer}
.list li:hover{background:var(--acs)}.list li.on{background:var(--acs);box-shadow:inset 4px 0 var(--ac)}
.list b{display:block}.list span{color:var(--mu);font-size:12px}
.dup{display:inline-block;background:var(--acs);color:var(--acx);font-size:11px;border-radius:10px;padding:0 7px;margin-left:6px;font-weight:700;font-style:normal;border:1px solid var(--ac)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.mapwrap{position:relative;flex:1 0 360px;background:#e8e6dc}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.ctrl{position:absolute;top:10px;right:10px;display:grid;gap:4px}
.ctrl button,.lay button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer}
.ctrl button{width:34px;height:34px;border-radius:8px;font-size:18px}
.lay{position:absolute;top:10px;left:10px;display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
.lay button{border:0;padding:7px 12px;font:inherit;font-size:13px}.lay button.on{background:var(--ac);color:var(--act);font-weight:700}
.coord{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--mu);background:var(--sf);padding:2px 8px;border-radius:6px;opacity:.9}
.empty{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--wns);color:var(--wn);padding:6px 12px;border-radius:8px;display:none;font-size:13px}
.info{padding:14px 16px;background:var(--sf);border-left:1px solid var(--bd);overflow:auto;min-height:0}
.info h2{margin:0;font-size:18px;border-left:5px solid var(--ac);padding-left:10px}.info p{margin:2px 0 12px 15px;color:var(--mu)}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;padding:10px 12px;background:var(--bg)}
.card small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.card strong{display:block;margin-top:2px;font-size:15px;overflow-wrap:anywhere}
.card.bad{background:var(--wns);border-color:var(--wn)}.card.bad strong{color:var(--wn)}
.chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.chips span{font-size:12px;background:var(--acs);color:var(--acx);border-radius:12px;padding:2px 10px}
.act{margin-top:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.act b{font-size:12px;color:var(--mu);margin-right:2px}
.act button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.act button[data-a="wa"],.act button[data-a="nat"]{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
.actbar{padding:10px 16px;background:var(--sf);border-top:1px solid var(--bd)}.actbar:empty{display:none}.hint{padding:18px 16px;color:var(--mu);background:var(--sf);border-top:1px solid var(--bd)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#000;color:#ffc400;padding:9px 18px;border-radius:20px;font-weight:600;display:none;z-index:9}

.adm{display:none!important}body.admin .adm{display:inline-block!important}
.role{font-size:12px;border:1px solid #555;border-radius:14px;padding:4px 10px;color:#ccc}.role.on{background:#ffc400;color:#000;border-color:#ffc400;font-weight:700}
#exp,#bulk{border:1px solid #ffc400;background:transparent;color:#ffc400;padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.xm{position:fixed;top:66px;right:16px;display:none;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.xm button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:9px 12px;cursor:pointer;font:inherit;border-radius:6px}.xm button:hover{background:var(--acs)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:12px}
.dlg{background:var(--sf);color:var(--tx);border-radius:12px;border-top:4px solid var(--ac);padding:16px;max-width:780px;width:100%;max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 12px}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.fg input::placeholder{color:var(--mu);opacity:.8}
.fg label{display:grid;gap:3px;font-size:11px;color:var(--mu);text-transform:uppercase}
.er{color:var(--wn);min-height:18px;margin:8px 0 4px;font-weight:600}.bt{display:flex;gap:8px;flex-wrap:wrap}
.bt button{padding:9px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font:inherit}
.bt .sv{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:700}.bt .dx{color:var(--wn);border-color:var(--wn);margin-left:auto}
/* ===== v2: cobertura, resumen, calidad, móvil ===== */
.bdg{display:none;background:#d92d20;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:6px;font-weight:700}
.cov{position:absolute;left:10px;top:50px;z-index:2;background:var(--sf);border:1px solid var(--bd);border-radius:10px;font-size:12px;width:min(256px,calc(100% - 66px));box-shadow:0 2px 10px rgba(0,0,0,.18)}
.cvh{display:flex;align-items:center;gap:6px;padding:6px 8px}
.cvh label{display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}
.cvh input{width:auto;padding:0;margin:0}
.cvh select{flex:1;min-width:0;padding:4px 6px;font-size:12px;border-radius:6px}
.cvx{border:0;background:none;color:var(--tx);cursor:pointer;font-size:14px;padding:0 4px}
.cov.fold .cvl,.cov.noc .cvl{display:none}.cov.fold .cvx{transform:rotate(-90deg)}
/* leyenda arriba a la izquierda y botones Calles/Satélite a su derecha, cuando el mapa tiene ancho */
.mapwrap{container-type:inline-size}
@container (min-width:520px){.cov{top:10px}.cov~.lay{left:276px}}
.cvl{border-top:1px solid var(--bd);padding:4px;max-height:230px;overflow:auto}
.lg{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;color:var(--tx);cursor:pointer;font:inherit;padding:4px 6px;border-radius:6px;text-align:left}
.lg:hover{background:var(--acs)}.lg i{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.3)}
.lg span{flex:1}.lg b{color:var(--mu);font-variant-numeric:tabular-nums;font-weight:600}
.lg.off{opacity:.4}.lg.off span{text-decoration:line-through}
.cvt{padding:2px 8px 4px;color:var(--mu);font-size:11px}
.km{float:right;font-style:normal;color:var(--acx);font-weight:700;font-size:12px}
.mv{display:none}
.pg{height:100%;overflow:auto;padding:18px 22px 40px;max-width:1200px;margin:0 auto}
.pgt{margin:0;font-size:20px;border-left:5px solid var(--ac);padding-left:10px}
.pgs{color:var(--mu);margin:6px 0 14px 15px;font-size:13px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--sf);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;padding:10px 12px}
.tile small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tile strong{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;color:var(--mu);font-size:12px}
.tile.bad{background:var(--wns);border-color:var(--wn)}.tile.bad strong{color:var(--wn)}
.rsh{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.rsh label{display:grid;gap:3px;font-size:11px;color:var(--mu);text-transform:uppercase}
.rsh select{min-width:180px}.rsh input{max-width:260px}
.rsh button,.vb{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.rsh button:hover,.vb:hover{background:var(--acs);border-color:var(--ac)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
.gt{width:100%;border-collapse:collapse}
.gt th{position:sticky;top:0;background:var(--sf);text-align:left;font-size:11px;text-transform:uppercase;color:var(--mu);padding:9px 10px;cursor:pointer;border-bottom:2px solid var(--ac);white-space:nowrap;user-select:none}
.gt th.n,.gt td.n{text-align:right}
.gt td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.gt td.n{font-variant-numeric:tabular-nums}.gt tr:last-child td{border-bottom:0}
.gt tr.rw:hover{background:var(--acs);cursor:pointer}
.gt small{color:var(--mu)}
.sb{display:flex;height:10px;border-radius:5px;overflow:hidden;min-width:130px;background:var(--bd)}.sb i{display:block;height:100%}
.ck{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ck>summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none}
.ck>summary::-webkit-details-marker{display:none}.ck>summary b{flex:1}
.ck>p{margin:0;padding:0 14px 10px;color:var(--mu);font-size:13px}
.ck .tw{border:0;border-top:1px solid var(--bd);border-radius:0;max-height:360px;overflow:auto}
.ct{font-style:normal;font-weight:700;background:var(--wns);color:var(--wn);border-radius:12px;padding:1px 10px;font-size:12px}
.ct.ok{background:#e3f4ea;color:#067647}
:root[data-theme="dark"] .ct.ok{background:#12301f;color:#6ce9a6}
.sv{font-size:10px;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 6px;letter-spacing:.04em;color:#fff}
.sv.alta{background:#b42318}.sv.media{background:#b54708}.sv.baja{background:#667085}
@media (max-width:820px){
 header{padding:6px 10px;gap:8px}.logo{height:46px}h1{font-size:14px}
 nav{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
 nav button,#th,#exp,.role{white-space:nowrap;flex:0 0 auto}
 .tab.on{display:flex;flex-direction:column}
 .mv{display:flex;background:var(--sf);border-bottom:1px solid var(--bd)}
 .mv button{flex:1;padding:10px;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
 .mv button.on{border-bottom-color:var(--ac);color:var(--acx)}
 .viewer{display:flex;flex-direction:column;height:auto;flex:1;min-height:0}
 .viewer[data-v="l"] .main,.viewer[data-v="l"] .info{display:none}
 .viewer[data-v="m"] .panel{display:none}
 .panel{border-right:0;max-height:none;flex:1}
 .main{flex:1 1 auto;overflow:hidden}.mapwrap{flex:1 1 auto;min-height:240px}
 .info{max-height:44%;border-left:0;border-top:1px solid var(--bd);padding:10px 14px}
 .cards{grid-template-columns:1fr 1fr}
 .ctrl button{width:40px;height:40px}
 .pg{padding:14px 12px 40px}
 .toast{bottom:70px}
}

.glmap{position:absolute;inset:0;z-index:0;overflow:hidden;background:#e8e6dc}
.attr{position:absolute;right:6px;bottom:4px;z-index:1;font-size:10px;color:var(--mu);background:var(--sf);opacity:.88;padding:1px 6px;border-radius:4px;pointer-events:none}
.ctrl button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.mapmsg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2;background:#fff;color:#141414;border:1px solid #ccc;border-radius:10px;padding:12px 14px;font-size:14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:80%}.mapmsg button{margin-top:8px;padding:8px 12px;border:0;border-radius:8px;background:#ffc400;font-weight:700;font-size:14px}
.tab{min-width:0;max-width:100%}.pg{min-width:0;max-width:100%}.pg .tw,.pg .ck{max-width:100%;min-width:0}html,body{max-width:100vw;overflow-x:hidden}
